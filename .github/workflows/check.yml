
name: İSPARK Bağlantı Kontrolü

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  kontrol:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: DNS ve bağlantı testleri
        run: |
          echo "================================"
          echo "1. ISPARK DNS"
          echo "================================"
          getent ahostsv4 ispark.istanbul || true

          echo "================================"
          echo "2. ANA ADRES HTTPS"
          echo "================================"
          curl -4 -I -L --connect-timeout 10 --max-time 15 https://ispark.istanbul/abone/ || true

          echo "================================"
          echo "3. ANA ADRES HTTP"
          echo "================================"
          curl -I -L --connect-timeout 10 --max-time 15 http://ispark.istanbul/ || true

          echo "================================"
          echo "4. WWW HTTPS"
          echo "================================"
          curl -I -L --connect-timeout 10 --max-time 15 https://www.ispark.istanbul/ || true

          echo "================================"
          echo "5. ONLINE ISPARK DNS"
          echo "================================"
          getent ahostsv4 online.ispark.istanbul || true

          echo "================================"
          echo "6. ONLINE ISPARK HTTPS"
          echo "================================"
          curl -I -L --connect-timeout 10 --max-time 15 https://online.ispark.istanbul/abone/ || true

          echo "================================"
          echo "7. DNS ALTERNATIF TESTI"
          echo "================================"
          python -c "import socket; print('Google DNS:', socket.gethostbyname('ispark.istanbul'))" || true
